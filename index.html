<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceToCalculateStuff</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <input id="display" readonly>

        <div id="btn">
            <button class="buttons" onclick="showUrSelfBih('-')">-</button>
            <button class="buttons" onclick="showUrSelfBih('9')">9</button>
            <button class="buttons" onclick="showUrSelfBih('8')">8</button>
            <button class="buttons" onclick="showUrSelfBih('7')">7</button>
            <button class="buttons" onclick="showUrSelfBih('+')">+</button>
            <button class="buttons" onclick="showUrSelfBih('6')">6</button>
            <button class="buttons" onclick="showUrSelfBih('5')">5</button>
            <button class="buttons" onclick="showUrSelfBih('4')">4</button>
            <button class="buttons" onclick="showUrSelfBih('*')">*</button>
            <button class="buttons" onclick="showUrSelfBih('3')">3</button>
            <button class="buttons" onclick="showUrSelfBih('2')">2</button>
            <button class="buttons" onclick="showUrSelfBih('1')">1</button>
            <button class="buttons" onclick="showUrSelfBih('/')">/</button>
            <button class="buttons" onclick="calculate()">=</button>
            <button class="buttons" onclick="showUrSelfBih('.')">.</button>
            <button class="buttons" onclick="showUrSelfBih('0')">0</button>
            <button class="buttons" onclick="clearDisplay()">C</button>
        </div>
    </div>





    <script src="script.js"></script>

</html>
